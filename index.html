<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO -->
    <title>Thanushan | Software Developer & Creative</title>
    <meta
      name="description"
      content="Explore Thanushan's portfolio featuring software engineering, AI projects, web development, and creative work in filmmaking and photography."
    />
    <meta name="author" content="Thanushan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.thanushan.com/" />

    <!-- Open Graph: link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thanushan | Software Developer & Creative" />
    <meta
      property="og:description"
      content="Software engineering, AI projects, and creative work in filmmaking and photography."
    />
    <meta property="og:url" content="https://www.thanushan.com/" />
    <meta property="og:site_name" content="Thanushan" />

    <!-- Social sharing: X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Thanushan | Software Developer & Creative" />
    <meta
      name="twitter:description"
      content="Explore my software engineering projects, AI work, and creative portfolio."
    />

    <!-- Structured data: personal website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Thanushan",
        "url": "https://www.thanushan.com/",
        "description": "Personal portfolio of Thanushan, showcasing software engineering, AI projects, and creative work."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
